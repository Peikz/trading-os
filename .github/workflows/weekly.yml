# Weekly job (SPEC §3): Saturday 09:00 Copenhagen on Friday's close (Emil, 27 Oct 2026; was
# Sunday). The cron-job.org timer starts it; these crons are the fallback. scripts/weekly.py
# exits unless it is Saturday in New York, and skips a week that is already saved.
# This repo is public and so are these logs: the job prints counts and status only.

name: Weekly

on:
  schedule:
    - cron: "0 8 * * 6"       # 09:00 CET (10:00 CEST)
    - cron: "0 10 * * 6"      # late fallback
  workflow_dispatch:
    inputs:
      timer:
        description: "Started by the cron-job.org timer (counts as the scheduled run)"
        type: boolean
        default: false
      force:
        description: "Skip the time guard (output goes to data/manual/, never counts as the session run)"
        type: boolean
        default: false

concurrency:
  group: data-repo            # every job that writes trading-os-data shares this group
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check out data repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/trading-os-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - run: uv sync --frozen --no-dev

      - name: Run weekly scans
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          RUN_TRIGGER: ${{ inputs.timer && 'timer' || '' }}
        run: uv run --frozen --no-dev python scripts/weekly.py --data-dir data-repo $FORCE

      - name: Commit data
        if: always()
        working-directory: data-repo
        run: |
          git config user.name "trading-os-bot"
          git config user.email "trading-os-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Data: nothing new to commit"
            exit 0
          fi
          git commit -q -m "weekly $(TZ=America/New_York date +%F): data (run ${{ github.run_id }})"
          # Jobs write different files, so a rebase never conflicts; retry a push race.
          for attempt in 1 2 3; do
            if git pull -q --rebase && git push -q; then
              echo "Data: committed and pushed"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Data: push failed after 3 attempts"
          exit 1

      - name: Notify failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg topic "$NTFY_TOPIC" --arg click "$RUN_URL" \
            '{topic: $topic, title: "Trading OS · Weekly failed", message: "Weekly job failed. Tap to open the Actions run.", tags: ["warning"], priority: 4, click: $click}' \
            | curl -sS -o /dev/null -w "Failure push: HTTP %{http_code}\n" -H "Content-Type: application/json" -d @- https://ntfy.sh/
