# Sends today's scheduled pushes again (Emil, 28 Oct 2026: ntfy had them, the iPhone never got
# them). Reads the topic's last 12 hours from ntfy and re-sends the messages whose title starts
# with `match`, at high priority, marked "(resent)". The public log prints counts only.

name: Push resend

on:
  workflow_dispatch:
    inputs:
      match:
        description: "Title starts with (several: separate with |)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resend the matching messages
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MATCH: ${{ inputs.match }}
        run: |
          curl -sf "https://ntfy.sh/$NTFY_TOPIC/json?poll=1&since=12h" > history.jsonl
          # Sizes only (title + text + link bytes, attachment or not); price alerts' titles name
          # a stock, so only the scheduled pushes' titles (counts, no tickers) are printed.
          jq -r 'select(.event == "message")
            | [(.time | strftime("%H:%M UTC")),
               ((.title // "") | utf8bytelength) + ((.message // "") | utf8bytelength) + ((.click // "") | utf8bytelength),
               (if .attachment then "attachment" else "inline" end),
               (if ((.title // "") | startswith("Trading OS")) then "price alert" else ((.title // "") | .[0:26]) end)]
            | @tsv' history.jsonl
          python3 - <<'EOF'
          import json, os, urllib.request
          # Under Apple's 4 KB like the live pushes (notify.APNS_BUDGET): lines are cut from
          # the end until title + text + tap link fit.
          BUDGET = 3300
          topic, match = os.environ["NTFY_TOPIC"], os.environ["MATCH"].split("|")
          n = total = 0
          for line in open("history.jsonl", encoding="utf-8"):
              m = json.loads(line)
              if m.get("event") != "message":
                  continue
              total += 1
              title = m.get("title", "")
              if not any(title.startswith(x) for x in match) or "resent" in title or "manual run" in title:
                  continue
              title += " (resent)"
              click = m.get("click", "")
              lines = m.get("message", "").split("\n")
              room = BUDGET - len(title.encode()) - len(click.encode())
              cut = 0
              while len("\n".join(lines).encode()) > room - 40 and len(lines) > 1:
                  lines.pop()
                  cut += 1
              body = "\n".join(lines) + ("\n… more on Today" if cut else "")
              payload = {"topic": topic, "title": title, "message": body, "priority": 4,
                         "tags": ["chart_with_upwards_trend"]}
              if click:
                  payload["click"] = click
              req = urllib.request.Request("https://ntfy.sh/", json.dumps(payload).encode(),
                                           {"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=15).read()
              n += 1
          print(f"resent {n} of {total} messages")
          EOF
