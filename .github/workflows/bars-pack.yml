# The dashboard's 2-year daily bars as one compact file (Emil, 20 Oct 2026): packed from the
# data repo's per-session bar files after the morning catch-up and published to its
# "bars-2y" release (the previous file removed). The dashboard reads it from its cache.
# This repo is public: counts only.

name: Bars pack

on:
  schedule:
    - cron: "15 10 * * 2-6"   # after the Backfill job (09:30 UTC)
  workflow_dispatch:
    inputs:
      timer:
        description: "Started by the cron-job.org timer (counts as the scheduled run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check out data repo (bars only)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/trading-os-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
          sparse-checkout: |
            data/bars

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - run: uv sync --frozen --no-dev

      - name: Pack
        run: uv run --frozen --no-dev python -m trading_os.bars_pack --data-dir data-repo --out out

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          REPO="${{ github.repository_owner }}/trading-os-data"
          # GitHub's API answers an odd call with HTTP 500 (Emil, 4 Nov 2026: one delete failed
          # the run): each call gets three tries; upload --clobber and delete are safe to repeat.
          try() { for attempt in 1 2 3; do "$@" && return 0; sleep $((attempt * 10)); done; return 1; }
          gh release view bars-2y -R "$REPO" >/dev/null 2>&1 || try gh release create bars-2y -R "$REPO" --title "Daily bars, 2 years (compact)" --notes "The dashboard's 2-year daily bars in one file, refreshed each morning." >/dev/null
          DAY=$(ls out | head -1 | cut -d_ -f3)
          try gh release upload bars-2y out/*.parquet -R "$REPO" --clobber
          for old in $(gh release view bars-2y -R "$REPO" --json assets -q '.assets[].name'); do
            case "$old" in bars_2y_${DAY}_*) ;; *) try gh release delete-asset bars-2y "$old" -R "$REPO" -y || echo "kept an old file (GitHub error); the next run removes it" ;; esac
          done
          echo "published $(ls out | wc -l) files for $DAY"
