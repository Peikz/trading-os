# Pre-market job (SPEC §3): target 07:30 New York. The cron-job.org timer also starts an early
# push at 11:30 Copenhagen time (input `early`; Emil, 26 Oct 2026).
# Two crons, one per US DST state; scripts/premarket.py exits unless New York time is in
# 07:15-07:55 on a trading day, and skips a session that is already saved.
# This repo is public and so are these logs: the job prints counts and status only.

name: Pre-market

on:
  schedule:
    - cron: "17 11 * * 1-5"   # 07:17 EDT
    - cron: "17 12 * * 1-5"   # 07:17 EST
  workflow_dispatch:
    inputs:
      timer:
        description: "Started by the cron-job.org timer (counts as the scheduled run)"
        type: boolean
        default: false
      force:
        description: "Skip the time guard (output goes to data/manual/, never counts as the session run)"
        type: boolean
        default: false
      early:
        description: "The early push, 11:00-12:30 Copenhagen (saved under data/manual/)"
        type: boolean
        default: false

concurrency:
  group: data-repo            # every job that writes trading-os-data shares this group
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check out data repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/trading-os-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - run: uv sync --frozen --no-dev

      - name: Run pre-market scans
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          EARLY: ${{ inputs.early && '--early' || '' }}
          RUN_TRIGGER: ${{ inputs.timer && 'timer' || '' }}
        run: uv run --frozen --no-dev python scripts/premarket.py --data-dir data-repo $FORCE $EARLY

      - name: Commit data
        if: always()
        working-directory: data-repo
        run: |
          git config user.name "trading-os-bot"
          git config user.email "trading-os-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Data: nothing new to commit"
            exit 0
          fi
          git commit -q -m "pm $(TZ=America/New_York date +%F): data (run ${{ github.run_id }})"
          # Jobs write different files, so a rebase never conflicts; retry a push race.
          for attempt in 1 2 3; do
            if git pull -q --rebase && git push -q; then
              echo "Data: committed and pushed"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Data: push failed after 3 attempts"
          exit 1

      - name: Notify failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg topic "$NTFY_TOPIC" --arg click "$RUN_URL" \
            '{topic: $topic, title: "Trading OS · Pre-market failed", message: "Pre-market job failed. Tap to open the Actions run.", tags: ["warning"], priority: 4, click: $click}' \
            | curl -sS -o /dev/null -w "Failure push: HTTP %{http_code}\n" -H "Content-Type: application/json" -d @- https://ntfy.sh/
