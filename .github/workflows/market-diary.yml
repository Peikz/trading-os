# Market diary (Emil, 20 Nov 2026): the day's market context saved as data in the private data
# repo (data/diary/), facts only, no AI. The cron-job.org timer starts it at 18:20 New York
# (config/runs.yaml); the cron below is a late backup. scripts/market_diary.py exits unless
# today's session has closed and writes the day once.
# This repo is public and so are these logs: the job prints counts and status only.

name: Market diary

on:
  schedule:
    - cron: "30 23 * * 1-5"   # late backup: 19:30 EDT / 18:30 EST
  workflow_dispatch:
    inputs:
      timer:
        description: "Started by the cron-job.org timer (counts as the scheduled run)"
        type: boolean
        default: false
      force:
        description: "Skip the trading-day guard"
        type: boolean
        default: false
      from:
        description: "Backfill from this session (YYYY-MM-DD, with `to`)"
        type: string
        default: ""
      to:
        description: "Backfill to this session (YYYY-MM-DD, with `from`)"
        type: string
        default: ""

concurrency:
  group: data-repo            # every job that writes trading-os-data shares this group
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check out data repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/trading-os-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - run: uv sync --frozen --no-dev

      - name: Build the market diary
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          RUN_TRIGGER: ${{ inputs.timer && 'timer' || '' }}
        run: |
          RANGE=""
          if [ -n "$FROM" ] || [ -n "$TO" ]; then RANGE="--from $FROM --to $TO"; fi
          uv run --frozen --no-dev python scripts/market_diary.py --data-dir data-repo $FORCE $RANGE

      - name: Commit data
        if: always()
        working-directory: data-repo
        run: |
          git config user.name "trading-os-bot"
          git config user.email "trading-os-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Data: nothing new to commit"
            exit 0
          fi
          git commit -q -m "diary $(TZ=America/New_York date +%F): data (run ${{ github.run_id }})"
          # Jobs write different files, so a rebase never conflicts; retry a push race.
          for attempt in 1 2 3; do
            if git pull -q --rebase && git push -q; then
              echo "Data: committed and pushed"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Data: push failed after 3 attempts"
          exit 1

      - name: Notify failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg topic "$NTFY_TOPIC" --arg click "$RUN_URL" \
            '{topic: $topic, title: "Trading OS · Market diary failed", message: "Market diary job failed. Tap to open the Actions run.", tags: ["warning"], priority: 4, click: $click}' \
            | curl -sS -o /dev/null -w "Failure push: HTTP %{http_code}\n" -H "Content-Type: application/json" -d @- https://ntfy.sh/
