# Point-in-time fundamentals for the 10-year study from SEC EDGAR's free bulk files (Emil,
# 20 Oct 2026). "build" downloads submissions.zip and companyfacts.zip, checks ambiguous
# earnings acceptance times against EDGAR's filing headers (cached in the release, so a rerun
# continues), builds the five tables and uploads them to the data repo's "sec-10y" release
# (not git). "check" compares JSON and header times on a small sample. Manual runs only.
# This repo is public: the job prints counts and status only.

name: SEC bulk

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = the five tables to release sec-10y; check = acceptance-time audit"
        type: choice
        options: [build, check]
        default: build
      since:
        description: "older build: facts and events from this date (e.g. 2009-01-01); empty = config"
        default: ""
      release:
        description: "release to write (sec-10y; an older build goes to its own, e.g. sec-2009)"
        default: sec-10y

concurrency:
  group: sec
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sec-bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Check out data repo (ticker list only)
        if: ${{ inputs.mode == 'build' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/trading-os-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
          sparse-checkout: data/ep_enrich/tickers.parquet
          sparse-checkout-cone-mode: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - run: uv sync --frozen --no-dev

      - name: Daily bars and earlier header checks
        if: ${{ inputs.mode == 'build' }}
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          REPO="${{ github.repository_owner }}/trading-os-data"
          mkdir -p bars work
          gh release download bars-alpaca -R "$REPO" -D bars -p "20*.parquet"
          gh release download "${{ inputs.release }}" -R "$REPO" -D work -p acceptance_checks.parquet 2>/dev/null || true
          echo "bar files: $(ls bars | wc -l), cached checks: $(ls work | wc -l)"

      - name: SEC bulk
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: uv run --frozen --no-dev python -m trading_os.sec_bulk_cli --mode ${{ inputs.mode }} --data-dir data-repo --bars bars --work work --out out ${{ inputs.since != '' && format('--facts-since {0} --events-since {0}', inputs.since) || '' }}

      - name: Keep the header checks (also after a failure, so a rerun continues)
        if: ${{ always() && inputs.mode == 'build' && hashFiles('out/acceptance_checks.parquet') != '' }}
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          REPO="${{ github.repository_owner }}/trading-os-data"
          gh release view "${{ inputs.release }}" -R "$REPO" >/dev/null 2>&1 || gh release create "${{ inputs.release }}" -R "$REPO" --title "SEC fundamentals (${{ inputs.release }})" --notes "Point-in-time earnings events, quarterly EPS/revenue/net income, shares, companies and ticker-CIK map from SEC EDGAR's bulk files (trading_os/sec_bulk.py)." >/dev/null
          gh release upload "${{ inputs.release }}" out/acceptance_checks.parquet -R "$REPO" --clobber

      - name: Upload
        if: ${{ inputs.mode == 'build' }}
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          REPO="${{ github.repository_owner }}/trading-os-data"
          gh release upload "${{ inputs.release }}" out/*.parquet out/summary.json -R "$REPO" --clobber
          echo "uploaded: $(ls out | wc -l) files"
