# Massive extras for the EP history study (Emil, 19 Oct 2026): minute bars, the ticker list,
# short interest, market cap at the time and the EP-day headlines. 5 calls/min on the free
# plan, so it runs at night outside every other Massive user (EOD headlines ~20:17-21:30 UTC,
# the bar catch-up at 09:30 UTC) and resumes where it stopped; once everything is fetched a
# run finds nothing to do and exits. This repo is public: the job prints counts only.

name: EP enrich

on:
  schedule:
    - cron: "35 22 * * *"     # until 04:20 UTC
    - cron: "30 4 * * *"      # until 09:20 UTC (before the 09:30 bar catch-up)
    - cron: "45 9 * * 0,6"    # weekends: until 15:30 UTC
  workflow_dispatch:
    inputs:
      until:
        description: "Stop at this UTC time (HH:MM)"
        default: "20:00"

concurrency:
  group: ep-enrich
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Check out data repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/trading-os-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - run: uv sync --frozen --no-dev

      - name: Fetch
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          UNTIL: ${{ inputs.until || (github.event.schedule == '35 22 * * *' && '04:20') || (github.event.schedule == '30 4 * * *' && '09:20') || '15:30' }}
        run: uv run --frozen --no-dev python scripts/ep_enrich.py --data-dir data-repo --max-calls 1800 --minutes 345 --until "$UNTIL"

      - name: Commit data
        if: always()
        working-directory: data-repo
        run: |
          git config user.name "trading-os-bot"
          git config user.email "trading-os-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Data: nothing new to commit"
            exit 0
          fi
          git commit -q -m "ep enrich: data (run ${{ github.run_id }})"
          for attempt in 1 2 3; do
            if git pull -q --rebase && git push -q; then
              echo "Data: committed and pushed"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Data: push failed after 3 attempts"
          exit 1
