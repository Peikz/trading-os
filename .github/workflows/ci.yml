name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Tests use synthetic data only; nothing market-related reaches this public log.
      - run: uv run pytest

  # The React dashboard's API (api/): its tests need the api group (FastAPI). Synthetic data only.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group api
      - run: uv run pytest tests/test_api.py tests/test_api_pages.py tests/test_api_2b.py tests/test_api_3.py

  # The React dashboard (web/): lint, type check and build, unit tests.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # End to end (web/e2e, tests/e2e): the real API over a synthetic data repo serving the built
  # React app, clicked through in Chromium; plus every Streamlit page and section over the same
  # repo. Synthetic data only, offline (no gh, TradingView or Alpaca calls).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Did the dashboards change?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"  # first push of a branch: run it
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(api|web|trading_os|app|tests/e2e|config)/|^(pyproject\.toml|uv\.lock)$|^\.github/workflows/ci\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - if: steps.changed.outputs.run == 'true'
        run: uv sync --frozen --group api --group app
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.changed.outputs.run == 'true'
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - if: steps.changed.outputs.run == 'true'
        id: pw
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.run == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.changed.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.changed.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - if: steps.changed.outputs.run == 'true'
        working-directory: web
        run: npm run e2e
      - if: steps.changed.outputs.run == 'true'
        run: uv run pytest tests/e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
