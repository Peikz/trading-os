# Minute bars for the entry/exit study of every strategy (Emil, 19 Oct 2026). Only stock-days
# not asked for before are fetched; files go to the private data repo as assets of the
# "intraday-minutes" release, not into git (about 1.5 GB). Manual runs only. The 10-year set also takes every
# earnings release made after the close or before the open (release sec-10y) into the gap
# group, so after-hours and pre-market EP entries are measured whatever the next open did.
# This repo is public: the job prints counts only.

name: Intraday study minutes

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "stop fetching after N minutes (the next run resumes)"
        default: "300"
      long_years:
        description: "FIRST-LAST for the 10-year fetch from Alpaca's daily bars (empty: 2 years)"
        default: ""

permissions:
  contents: read

concurrency:
  group: intraday-minutes   # a second run waits, then fetches only what the first didn't
  cancel-in-progress: false

jobs:
  minutes:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v7

      - name: Check out data repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/trading-os-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - run: uv sync --frozen --no-dev

      - name: Stock-days already asked for
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          mkdir -p minutes
          REPO="${{ github.repository_owner }}/trading-os-data"
          gh release view intraday-minutes -R "$REPO" >/dev/null 2>&1 || gh release create intraday-minutes -R "$REPO" --title "Intraday study minute bars" --notes "Minute bars for the entry/exit study (Alpaca). Per month and run: bars plus the stock-days asked for." >/dev/null
          gh release download intraday-minutes -R "$REPO" -D minutes -p '*.asked.parquet' 2>/dev/null || true
          echo "files already there: $(ls minutes | wc -l)"
          touch minutes/.start

      - name: Ten-year inputs
        if: inputs.long_years != ''
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          REPO="${{ github.repository_owner }}/trading-os-data"
          mkdir -p bars hist cands sec
          gh release download bars-alpaca -R "$REPO" -D bars
          gh release download history-10y -R "$REPO" -D hist
          gh release download sec-10y -R "$REPO" -D sec -p 'earnings_events.parquet' -p 'ticker_cik.parquet'
          # v3 = v2 plus the earnings days; built from v2 on the first run
          if ! gh release download intraday-minutes -R "$REPO" -D cands -p 'candidates_10y_v3.parquet' 2>/dev/null; then
            gh release download intraday-minutes -R "$REPO" -D cands -p 'candidates_10y_v2.parquet' 2>/dev/null               && mv cands/candidates_10y_v2.parquet cands/candidates_10y_v3.parquet || true
          fi
          echo "bars: $(ls bars | wc -l), histories: $(ls hist | wc -l), cached candidates: $(ls cands | wc -l)"

      - name: Fetch
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          LONG: ${{ inputs.long_years != '' && format('--long-bars bars --long-hits hist --years {0} --cands cands/candidates_10y_v3.parquet --earnings sec', inputs.long_years) || '' }}
        run: uv run --frozen --no-dev python -m trading_os.intraday_cli --data-dir data-repo --fetch minutes --minutes "${{ inputs.minutes }}" $LONG

      - name: Upload new files
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          REPO="${{ github.repository_owner }}/trading-os-data"
          new=$(find minutes -name '*_*.parquet' -newer minutes/.start | sort)
          [ -z "$new" ] && { echo "nothing new"; exit 0; }
          gh release upload intraday-minutes $new -R "$REPO" --clobber
          echo "uploaded: $(echo "$new" | wc -l) files"
          # One small index of every stock-day with minute bars, for the dashboard's charts.
          uv run --frozen --no-dev python -c "import glob, pandas as pd; fs = glob.glob('minutes/*.asked.parquet'); idx = pd.concat([pd.read_parquet(f, columns=['session_date', 'ticker']) for f in fs]).drop_duplicates(); idx.to_parquet('minutes/minute_index.parquet', index=False)"
          gh release upload intraday-minutes minutes/minute_index.parquet -R "$REPO" --clobber
          if [ -f cands/candidates_10y_v3.parquet ]; then
            gh release upload intraday-minutes cands/candidates_10y_v3.parquet -R "$REPO" --clobber
          fi
