# Manual end-to-end check of the scan jobs on GitHub's runners: TradingView access, Linux
# dependencies, charts and reports. Forced runs into a throwaway folder: writes nothing anywhere
# and needs no secrets. With `push`, the EOD job also sends its message to ntfy (NTFY_TOPIC);
# with `fail`, the run fails on purpose to test the failure push.
# Logs show counts and status only.

name: Pipeline check

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Send the EOD message to your phone (ntfy) as a test"
        type: boolean
        default: false
      fail:
        description: "Simulate a failure to test the failure push"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: EOD (forced)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          PUSH: ${{ inputs.push && 'yes' || '' }}
        run: |
          if [ "$PUSH" = "yes" ]; then
            uv run --frozen --no-dev python scripts/eod.py --data-dir "$RUNNER_TEMP/data" --force
          else
            uv run --frozen --no-dev python scripts/eod.py --data-dir "$RUNNER_TEMP/data" --force --no-push
          fi
      - name: Pre-market (forced, no push)
        run: uv run --frozen --no-dev python scripts/premarket.py --data-dir "$RUNNER_TEMP/data" --force --no-push
      - name: Intraday 10:15 (forced, no push)
        run: uv run --frozen --no-dev python scripts/intraday.py --data-dir "$RUNNER_TEMP/data" --slot am --force --no-push
      - name: Weekly (forced, no push)
        run: uv run --frozen --no-dev python scripts/weekly.py --data-dir "$RUNNER_TEMP/data" --force --no-push
      - name: Files written (counts only)
        run: |
          echo "parquet: $(find "$RUNNER_TEMP/data" -name '*.parquet' | wc -l)"
          echo "charts:  $(find "$RUNNER_TEMP/data" -name '*.png' | wc -l)"
          echo "reports: $(find "$RUNNER_TEMP/data" -name '*.md' | wc -l)"

      - name: Simulated failure
        if: inputs.fail
        run: |
          echo "Simulating a failure to test the failure push"
          exit 1

      - name: Notify failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg topic "$NTFY_TOPIC" --arg click "$RUN_URL" \
            '{topic: $topic, title: "Trading OS · Pipeline check failed", message: "Pipeline check failed. Tap to open the Actions run.", tags: ["warning"], priority: 4, click: $click}' \
            | curl -sS -o /dev/null -w "Failure push: HTTP %{http_code}\n" -H "Content-Type: application/json" -d @- https://ntfy.sh/
