# Trading OS — every threshold lives here (SPEC §1.5). Code holds no magic numbers.
# Change a value only on Emil's decision (CLAUDE.md, hard rules).
#
# Units: percentages are percent numbers (10 = 10 %), money is USD, volume is shares.
# Key suffixes: *_min means >=, *_gt means >, *_below means <, *_max means <=.
# Slots: pm (pre-market job), eod (end-of-day job), weekly (Sunday job).
# Actions: push = saved + phone notification, log = saved only, watchlist = saved (feeds the
# watchlists once they exist, Phase 2). Every scan is always saved.

version: 1

universe:                                   # SPEC §4
  market: america
  include_types: [stock, dr]                # common stock + ADRs (SPEC §11.8)
  exclude_exchanges: [OTC]
  exclude_typespecs: [preferred, unit, warrant, right, etf, etn]
  logged:
    price_min: 0.50
    market_cap_min: 50_000_000
    avg_dollar_volume_20d_min: 500_000
  alert:
    price_min: 1.00
    market_cap_min: 50_000_000
    avg_volume_20d_min: 500_000
    signal_dollar_volume_min: 5_000_000     # SWVL guard, EOD signals

proxies:                                    # SPEC §11.6, Phase 1 only (until Massive history)
  rvol_avg_volume: average_volume_60d_calc  # SPEC: 50 days excl. today. TV's average includes
  rvol_avg_days: 60                         # today, so metrics removes it: (60*avg - vol) / 59
  avg_volume_20d: average_volume_30d_calc
  avg_dollar_volume_20d: AvgValue.Traded_30d
  returns:                                  # SPEC: 22/63/126 trading days; TV: calendar periods
    "22": Perf.1M
    "63": Perf.3M
    "126": Perf.6M
  adr: ADR                                  # SPEC: ADR(20) % = mean(high/low - 1); TV: 14-day mean
                                            # range in $, so ADR % = ADR / close x 100

schedule:                                   # SPEC §3
  timezone: America/New_York
  calendar: XNYS
  windows_et:
    pm: ["07:15", "07:55"]
    eod: ["16:15", "17:30"]
  weekly_day: Sunday                        # New York date; the job reports the week's last session

scans:
  # --- Pre-market (SPEC §6.1) ---
  ep_pm:
    {enabled: true, phase: 1, slot: pm, action: push, push_tier: alert,
     pm_change_min_pct: 10, price_min: 1.00, pm_volume_min: 50_000, market_cap_min: 50_000_000}
  # pm_gap_basis (proposed, pending Emil): premarket_change = current pre-market price vs
  # prior close; premarket_gap = first pre-market print vs prior close.
  ep9m_early:
    {enabled: true, phase: 1, slot: pm, action: push, push_tier: alert,
     pm_volume_min: 500_000, pm_gap_min_pct: 4, pm_gap_basis: premarket_change}
  watchlist_gappers:
    {enabled: true, phase: 1, slot: pm, action: push,
     lists: [bo_watch, ep_watch], pm_gap_min_pct: 2, pm_gap_basis: premarket_change}

  # --- End of day (SPEC §6.2) ---
  ep_day:
    {enabled: true, phase: 1, slot: eod, action: push, push_tier: alert,
     gap_min_pct: 10, rvol_min: 3, volume_min: 300_000, price_min: 1.00, market_cap_min: 50_000_000}
  ep_ah:                                    # toggle, default OFF
    {enabled: false, phase: 1, slot: eod, action: push, push_tier: alert,
     ah_change_min_pct: 8, price_min: 1.00, market_cap_min: 50_000_000, ah_volume_min: 50_000}
  ep9m:                                     # EP scan: alert tier pushes (SPEC §11.7)
    {enabled: true, phase: 1, slot: eod, action: push, push_tier: alert,
     volume_min: 9_000_000, chg_min_pct: 4}
  mb_up:
    {enabled: true, phase: 1, slot: eod, action: log,
     chg_min_pct: 4, volume_min: 100_000, volume_gt_prior: true, close_loc_min: 0.70}
  mb_down:
    {enabled: true, phase: 1, slot: eod, action: log,
     chg_max_pct: -4, volume_min: 100_000, volume_gt_prior: true}
  parabolic_short:
    {enabled: true, phase: 1, slot: eod, action: log,
     lookback_days_max: 10, large_cap_min: 1_000_000_000,
     gain_min_pct_large_cap: 50, gain_min_pct_small_cap: 200, consec_up_min: 3}
  parabolic_long:
    {enabled: true, phase: 1, slot: eod, action: log,
     lookback_days_max: 10, drop_min_pct: 30, consec_down_min: 3}
  # Breadth: one line in the EOD push. Up/down use the Momentum Burst thresholds above.
  # up_count_rule (proposed, pending Emil): stockbee_4pct = change >= 4 % on volume above
  # the prior day (Stockbee Market Monitor); mb_up = also close location >= 0.70 (MB up).
  breadth:
    {enabled: true, phase: 1, slot: eod, action: push,
     universe_price_min: 5, universe_volume_min: 100_000,
     ratio_windows: [5, 10], quarter_move_pct: 25, ma_windows: [20, 40, 50],
     up_count_rule: stockbee_4pct}
  breakout_watch:                           # B1-B4 all pass -> BO-Watch (SPEC §6.4)
    {enabled: true, phase: 2, slot: eod, action: push, push_tier: alert}
  breakout_trigger:                         # B5 at the close, B1-B4 stored for grading
    {enabled: true, phase: 2, slot: eod, action: push, push_tier: alert}
  universe_snapshot:
    {enabled: true, phase: 1, slot: eod, action: log}

  # --- Weekly (SPEC §6.3) ---
  qm_gainers:
    {enabled: true, phase: 1, slot: weekly, action: push,
     top_pct: 2, return_windows: [22, 63, 126], adr_min_pct: 4,
     avg_dollar_volume_20d_min: 10_000_000, price_gt: 5}
  growth_bucket_1:
    {enabled: true, phase: 1, slot: weekly, action: push,
     price_gt: 10, avg_volume_gt: 100_000, rev_growth_q_min_pct: 40,
     quarters_to_check: 2, annual_revenue_gt: 25_000_000}
  growth_bucket_2:
    {enabled: true, phase: 1, slot: weekly, action: push,
     price_gt: 10, avg_volume_gt: 200_000, eps_growth_q_min_pct: 40,
     rev_growth_q_min_pct: 20, quarters_to_check: 2}
  tight_bases:                              # HTB + Ants merged (needs daily history)
    {enabled: true, phase: 2, slot: weekly, action: watchlist,
     high_52w_within_pct: 15, adr_min_pct: 4, above_ma: 50,
     range_days: 10, range_adr_mult_below: 1.5, volume_short_days: 10, volume_long_days: 50}

market_light:                               # SPEC §6.5 — owner's rules, do not change
  qqq:
    symbol: NASDAQ:QQQ
    sma_windows: [10, 20, 50]
    slope_lookback: 5                       # "SMA20 lower than 5 sessions ago"
  breadth:
    strong_ratio10_min: 1.5
    weak_ratio10_below: 1.0
    thrust_ratio5_gt: 2.0
    quarter_move_pct: 25
  scan_count:                               # this screen must not change
    country: USA
    price_gt: 5
    avg_volume_gt: 500_000
    avg_volume_field: average_volume_30d_calc  # (proposed, pending Emil): which TradingView
                                            # average your screen uses (10/30/60/90 days)
    perf_3m_min_pct: 50
    above_sma: 20
  thresholds:                               # first matching light wins: STOP, RED, GREEN, YELLOW
    stop_count_below: 5
    red_count_below: 15
    green_count_min: 50

watchlists:                                 # SPEC §7 (proposed rules, pending Emil)
  ep_watch_sources: [ep_day, ep_pm]         # alert-tier hits that enter EP-Watch
  ep_watch_max_sessions: 63                 # an EP-Watch entry expires after ~3 months
  bo_watch_stale_sessions: 10               # BO-Watch expires after 10 sessions without B1-B4

cats:                                       # SPEC §6.3 ranking column (proposed weights, pending Emil)
  apply_to: [qm_gainers, tight_bases]
  growth_bucket_points: 1.0                 # in Growth Bucket 1 or 2 this week
  recent_signal_points: 1.0                 # an MB up / EP hit in the last N sessions
  recent_signal_sessions: 10
  recent_signal_scans: [mb_up, ep_day, ep_pm, ep9m]
  volume_trend_points: 1.0                  # 30-day average volume above the 90-day average
  volume_trend_fields: [average_volume_30d_calc, average_volume_90d_calc]
  extension_free_adr: 3.0                   # no penalty within 3 ADR above MA10 ...
  extension_penalty_per_adr: 0.5            # ... then minus 0.5 per ADR beyond

breakout:                                   # SPEC §6.4. (proposed) = default, confirm in
                                            # the hand audit of 20 hits (SPEC §9, Phase 2)
  prior_move_min_pct: 30                    # B1: up >= 30 %
  prior_move_max_days: 63                   # B1: within 1-3 months
  base_min_days: 10                         # B2: 2-8 weeks
  base_max_days: 40
  contraction_ratio_max: 0.85               # B2: each pullback <= 0.85 x the previous
  min_contractions: 2                       # B2 (proposed)
  swing_adr_mult: 1.0                       # B2 (proposed): a pullback counts once price
                                            # comes back up >= 1 ADR $ from its low
  base_volume_ratio_max: 1.0                # B2 "quiet volume" (proposed): base average volume
                                            # below the 50-day average at the base's start
  right_side_days: 5                        # B4: last 5-10 days (proposed: 5)
  right_side_range_adr_max: 1.5             # B4 (proposed): right-side range < 1.5 x ADR $
  trigger_range_adr_min: 1.0                # B5: day range > ADR $
  trigger_rvol_min: 1.5                     # B5: RVOL >= 1.5
  stop_adr_mult: 1.0                        # order stop = max(last contraction low, pivot - 1 x ADR $)

epstudy:                                    # Phase 3: Breakout Log rows in the EPStudyDatabase sheet
  enabled: false                            # needs sheet_id + secret GOOGLE_SERVICE_ACCOUNT_JSON
  sheet_id: ""                              # from the sheet URL: /spreadsheets/d/<sheet_id>/
  worksheet: Breakout Log
  scans: [breakout_trigger, breakout_watch]
  columns: [session_date, scan, ticker, tier, pivot, order_stop, risk_adr, base_len,
            contraction_depths, b1, b2, b3, b4, b5, signal_id]  # (proposed) match the sheet

journal:                                    # Phase 4: broker fills -> trades with R (local import)
  csv_columns:                              # standard name: header in your export. Fill in
    trade_date: trade_date                  # from the first Saxo export (or export these names)
    ticker: ticker
    side: side
    quantity: quantity
    price: price
    fees: fees
  date_format: "%Y-%m-%d"
  buy_values: [buy, b, bought]
  sell_values: [sell, s, sold]
  signal_lookback_sessions: 5               # link a trade to a signal from the last N sessions
  signal_scans: [breakout_trigger, breakout_watch, ep_day, ep_pm, ep9m]

history:                                    # Phase 2: Massive (formerly Polygon.io) grouped daily bars
  massive_base_url: https://api.massive.com
  calls_per_minute: 5                       # free-tier limit (CLAUDE.md)
  adjusted: true                            # SPEC §2
  backfill_sessions: 504                    # ~2 years of NYSE sessions
  daily_catchup_calls: 5                    # scheduled run: fill the newest missing sessions

outcomes:                                   # Phase 3 (SPEC §7)
  horizons: [5, 10, 20, 60]                 # trading sessions after the signal

charts:                                     # Phase 3: before-shot PNG per alert candidate
  sessions: 120                             # sessions shown up to the signal

report:                                     # Markdown report per run (reports/ in the data repo)
  max_rows_per_scan: 25

stats:                                      # weekly outcome statistics (reports/stats/)
  min_signals: 5                            # smaller groups are left out

notify:                                     # SPEC §8
  server: https://ntfy.sh
  max_tickers_per_scan: 10
