[project]
name = "trading-os"
version = "0.1.0"
description = "Deterministic momentum scans for US equities. Code only; data lives in a private repo."
requires-python = ">=3.12,<3.13"
dependencies = [
    "tradingview-screener>=3.2,<4",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "exchange-calendars>=4.5",
    "requests>=2.32,<3",
    "openpyxl>=3.1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trading_os"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
